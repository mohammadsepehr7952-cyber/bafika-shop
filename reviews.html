<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظرات مشتریان | bafika</title>
<meta name="description" content="نظرات مشتریان bafika درباره محصولات دستباف.">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand"><img src="img/logo.png" alt="bafika" class="brand-logo"> bafika</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">خانه</a>
      <a href="products.html">محصولات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
      <a href="reviews.html" aria-current="page">نظرات</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="cart-link" aria-label="سبد خرید">
        <svg class="bf-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count" data-cart-count style="display:none;">0</span>
      </a>
      <button class="menu-toggle" aria-label="باز کردن منو" aria-expanded="false" aria-controls="navLinks">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">صدای مشتری‌های ما</span>
      <h1>نظرات مشتریان</h1>
      <p>تجربه‌ی خریدت رو با بقیه به اشتراک بذار.</p>
    </div>
  </section>

  <section class="container">
    <div class="reviews-wrap">
      <aside class="review-form-card">
        <h3>ثبت نظر جدید</h3>
        <form data-review-form novalidate>
          <div class="form-field">
            <label for="r-name">اسمت</label>
            <input type="text" id="r-name" placeholder="مثلاً سارا">
            <div class="form-error">لطفاً اسمت رو بنویس.</div>
          </div>
          <div class="form-field">
            <label>امتیاز</label>
            <div class="star-input">
              <button type="button" data-star="1">★</button>
              <button type="button" data-star="2">★</button>
              <button type="button" data-star="3">★</button>
              <button type="button" data-star="4">★</button>
              <button type="button" data-star="5">★</button>
            </div>
          </div>
          <div class="form-field">
            <label for="r-text">نظرت</label>
            <textarea id="r-text" placeholder="تجربه‌ات از خرید و کیفیت محصول رو بنویس..."></textarea>
            <div class="form-error">لطفاً نظرت رو بنویس.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">ثبت نظر</button>
        </form>
        <p class="form-note" style="margin-top:14px;margin-bottom:0;">نظرها فقط روی همین مرورگر ذخیره می‌شن.</p>
      </aside>

      <div class="reviews-list" data-reviews-list></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">© <span data-year></span> bafika. تمام حقوق محفوظ است.</div>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/chatbot.js?v=1" defer></script>
</body>
</html>
